<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Report | AI Code Sentinel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f1f5f9;
        }
        .report-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 24px;
        }
        .code-block {
            background: #0f172a;
            border-left: 4px solid #38bdf8;
            font-family: 'Fira Code', monospace;
        }
        .status-badge {
            padding: 4px 12px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="p-6 md:p-12">

    <div class="max-w-4xl mx-auto">
        <a href="/" class="text-sky-400 hover:text-sky-300 transition flex items-center mb-8 group">
            <i class="fas fa-arrow-left mr-2 group-hover:-translate-x-1 transition-transform"></i> 
            Back to Analyzer
        </a>

        <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-4">
            <div>
                <h1 class="text-4xl font-extrabold mb-2">Audit <span class="text-sky-400">Report</span></h1>
                <p class="text-gray-400">Analysis completed for <span class="text-white font-semibold italic">{{ language }}</span> snippet</p>
            </div>
            <div class="flex gap-3">
                <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 px-5 py-3 rounded-xl transition">
                    <i class="fas fa-print mr-2"></i> Print
                </button>
                <button class="bg-sky-600 hover:bg-sky-500 px-5 py-3 rounded-xl font-bold transition shadow-lg shadow-sky-900/40">
                    <i class="fas fa-download mr-2"></i> Save PDF
                </button>
            </div>
        </div>

        <div class="report-card p-8 shadow-2xl">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-10">
                <div class="bg-slate-900/50 p-4 rounded-2xl text-center border border-slate-800">
                    <p class="text-gray-500 text-xs mb-1">Status</p>
                    <span class="status-badge bg-green-500/10 text-green-500">Completed</span>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-2xl text-center border border-slate-800">
                    <p class="text-gray-500 text-xs mb-1">Severity</p>
                    <span class="status-badge bg-amber-500/10 text-amber-500">Medium</span>
                </div>
                </div>

            <div class="prose prose-invert max-w-none">
                <h3 class="text-xl font-bold flex items-center text-sky-400 mb-4">
                    <i class="fas fa-magnifying-glass-chart mr-3"></i> AI Findings
                </h3>
                
                <div class="space-y-6 text-gray-300 leading-relaxed">
                    <div id="ai-content">
                        {{ analysis_content | safe }}
                    </div>
                </div>
            </div>

            <hr class="my-10 border-slate-800">

            <h3 class="text-xl font-bold flex items-center text-green-400 mb-4">
                <i class="fas fa-wand-magic-sparkles mr-3"></i> Optimized Refactoring
            </h3>
            <div class="code-block p-6 rounded-2xl relative group">
                <button class="absolute top-4 right-4 text-slate-500 hover:text-white transition">
                    <i class="fas fa-copy"></i>
                </button>
                <pre class="text-sm overflow-x-auto"><code>{{ fixed_code }}</code></pre>
            </div>
        </div>

        <footer class="mt-12 text-center">
            <p class="text-gray-600 text-sm italic">Generated by AI Sentinel Engine v3.0 - Security Verified</p>
        </footer>
    </div>

</body>
</html>

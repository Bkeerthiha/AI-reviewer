<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.05); }
        
        /* Entrance Animations */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reveal { animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        /* Score Counter Glow */
        .score-glow { transition: all 1s ease; text-shadow: 0 0 20px currentColor; }
    </style>
</head>
<body class="flex h-screen p-6 gap-6">

    <aside class="w-72 glass rounded-[40px] p-10 flex flex-col border-r border-white/10">
        <h1 class="text-3xl font-black italic text-sky-400 mb-10 tracking-tighter uppercase">AI Reviewer</h1>
        <select id="language" class="bg-slate-900 border border-slate-700 p-4 rounded-2xl text-sky-400 font-bold outline-none mb-10 focus:ring-2 ring-sky-500/50 transition-all">
            <option value="java">Java 17</option>
            <option value="python">Python 3</option>
            <option value="javascript">JavaScript</option>
        </select>
        <a href="/" class="mt-auto text-red-500 font-bold uppercase text-[10px] tracking-[0.3em] hover:text-red-400">Log Out Session</a>
    </aside>

    <main class="flex-1 flex flex-col gap-6">
        <div class="flex-1 glass rounded-[50px] p-8 shadow-2xl relative group">
            <div class="absolute top-6 left-8 flex gap-2 opacity-30">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
            <textarea id="code-input" class="w-full h-full bg-transparent border-none outline-none font-mono text-sm text-sky-100/80 resize-none pt-10" placeholder="// Paste your code here..."></textarea>
        </div>
        <button onclick="runAudit()" class="w-full bg-sky-500 hover:bg-sky-400 py-6 rounded-[30px] font-black text-white uppercase tracking-[0.4em] shadow-xl shadow-sky-500/20 active:scale-95 transition-all">Execute Deep Scan</button>
    </main>

    <aside class="w-[450px] space-y-6 overflow-y-auto pr-2" id="results-container">
        <div class="glass p-16 rounded-[50px] text-center opacity-20 mt-20 border-dashed border-2 border-slate-700">
            <p class="italic text-sm">Awaiting Code Payload...</p>
        </div>
    </aside>

    <script>
        async function runAudit() {
            const code = document.getElementById('code-input').value;
            const lang = document.getElementById('language').value;
            const resContainer = document.getElementById('results-container');

            if(!code) return;

            const response = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ code, language: lang })
            });
            const data = await response.json();

            // 1. Score Card with Count-Up Simulation
            let html = `
                <div class="reveal glass p-10 rounded-[45px] border-t-[10px] shadow-2xl" style="border-color: ${data.color}">
                    <p class="text-[10px] font-bold text-slate-500 uppercase mb-2 tracking-widest">Health Integrity Score</p>
                    <h2 class="text-8xl font-black italic score-glow" style="color: ${data.color}">${data.score}%</h2>
                    <p class="text-sm font-black uppercase mt-4 tracking-widest" style="color: ${data.color}">${data.label}</p>
                </div>`;

            // 2. Issue Cards with Delayed Reveal
            data.issues.forEach((issue, idx) => {
                html += `
                    <div class="reveal glass p-8 rounded-[35px] border-l-[12px] mt-4 shadow-xl" style="border-color: ${issue.color}; animation-delay: ${0.2 + (idx * 0.1)}s">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="px-3 py-1 bg-black/40 rounded-lg text-[9px] font-black uppercase" style="color: ${issue.color}">${issue.type}</span>
                        </div>
                        <p class="text-lg font-bold text-white mb-3">${issue.msg}</p>
                        <div class="bg-black/30 p-4 rounded-2xl text-[12px] text-slate-400 leading-relaxed border border-white/5">
                            <span class="text-white/40 block text-[9px] font-bold uppercase mb-1">AI Recommendation:</span>
                            ${issue.explain}
                        </div>
                    </div>`;
            });

            resContainer.innerHTML = html;
        }
    </script>
</body>
</html>
